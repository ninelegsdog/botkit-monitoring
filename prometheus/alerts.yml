groups:
  - name: botkit
    rules:
      - alert: BotDown
        expr: up{job="botkit"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Bot {{ $labels.instance }} down"
          description: "/metrics недоступен 2+ минут на {{ $labels.instance }}"

      - alert: OTLPCollectorDown
        expr: probe_success{job="otlp-blackbox"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "OTLP collector {{ $labels.otlp_port }} unreachable"
          description: "TCP connect to 127.0.0.1:{{ $labels.otlp_port }} (otel-collector) не проходит 3+ минут. Телеметрия ботов (Tempo) остановлена."

      - alert: TempoDown
        expr: probe_success{job="tempo-ready"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Tempo readiness endpoint unavailable"
          description: "Tempo /ready on 127.0.0.1:3200 is unavailable for 3+ minutes; trace search/verification may fail."

      - alert: BotWebhookDown
        expr: probe_success{job="blackbox-webhooks"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Webhook unreachable for {{ $labels.bot }}"
          description: "Публичный webhook https://ninelegsbots.duckdns.org/webhook/{{ $labels.bot }} не отвечает 3+ минут (nginx/приложение/сеть)"

      - alert: BotErrorSpike
        expr: sum by (instance) (rate(botkit_errors_total{job="botkit"}[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Error spike on {{ $labels.instance }}"
          description: ">0.5 ошибок/сек в течение 5 минут"

      - alert: BotHighHandlerLatency
        expr: histogram_quantile(0.95, sum by (instance, le) (rate(botkit_handler_duration_seconds_bucket{job="botkit"}[5m]))) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "p95 handler latency > 5s on {{ $labels.instance }}"

      # Guarded error-rate: numerator/denominator finite, errors actually present,
      # and a floor of traffic so cold-start/zero-traffic bots never burn.
      - alert: BotErrorBudgetBurnFast
        expr: |
          (
            sum by (instance) (rate(botkit_errors_total{job="botkit"}[1h]))
            /
            sum by (instance) (rate(botkit_updates_total{job="botkit"}[1h]))
          ) > 0.02
          and on(instance) sum by (instance) (increase(botkit_errors_total{job="botkit"}[1h])) > 0
          and on(instance) sum by (instance) (rate(botkit_updates_total{job="botkit"}[1h])) > 1e-3
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "SLO: Fast error budget burn on {{ $labels.instance }}"
          description: "Error rate >2% (1h, ≥1 ошибка) — burning 14.4x error budget. SLO 99.9% at risk."

      - alert: BotErrorBudgetBurnMedium
        expr: |
          (
            sum by (instance) (rate(botkit_errors_total{job="botkit"}[6h]))
            /
            sum by (instance) (rate(botkit_updates_total{job="botkit"}[6h]))
          ) > 0.005
          and on(instance) sum by (instance) (increase(botkit_errors_total{job="botkit"}[6h])) > 0
          and on(instance) sum by (instance) (rate(botkit_updates_total{job="botkit"}[6h])) > 1e-4
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "SLO: Medium error budget burn on {{ $labels.instance }}"
          description: "Error rate >0.5% (6h, ≥1 ошибка) — burning 3.6x error budget. SLO 99.9% degrading."

      - alert: BotErrorBudgetBurnSlow
        expr: |
          (
            sum by (instance) (rate(botkit_errors_total{job="botkit"}[24h]))
            /
            sum by (instance) (rate(botkit_updates_total{job="botkit"}[24h]))
          ) > 0.001
          and on(instance) sum by (instance) (increase(botkit_errors_total{job="botkit"}[24h])) > 0
          and on(instance) sum by (instance) (rate(botkit_updates_total{job="botkit"}[24h])) > 1e-5
        for: 1h
        labels:
          severity: info
        annotations:
          summary: "SLO: Slow error budget burn on {{ $labels.instance }}"
          description: "Error rate >0.1% (24h, ≥1 ошибка) — burning 0.72x error budget. SLO 99.9% trending down."

      - alert: BotHandlerLatencySLOBreach
        expr: histogram_quantile(0.95, sum by (instance, le) (rate(botkit_handler_duration_seconds_bucket{job="botkit"}[5m]))) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "SLO: Handler p95 latency > 1s on {{ $labels.instance }}"
          description: "Handler p95 >1s for 10m (SLO target <1s). Users experiencing delays."

      - alert: BotWebhookLatencySLOBreach
        expr: histogram_quantile(0.95, sum by (instance, le) (rate(botkit_webhook_duration_seconds_bucket{job="botkit"}[5m]))) > 3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "SLO: Webhook p95 latency > 3s on {{ $labels.instance }}"
          description: "Webhook p95 >3s for 10m (SLO target <3s). Telegram retries likely."

      - alert: SSLCertExpiring
        expr: probe_ssl_earliest_cert_expiry{job="blackbox-cert"} - time() < 30 * 24 * 3600
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "SSL cert expiring in <30d for {{ $labels.instance }}"
          description: "Истечение сертификата {{ $labels.instance }} через менее чем 30 дней ({{ $value }}s)"

      - alert: SSLCertExpired
        expr: probe_ssl_earliest_cert_expiry{job="blackbox-cert"} - time() < 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "SSL cert expired for {{ $labels.instance }}"
          description: "Сертификат {{ $labels.instance }} истёк — Telegram webhook может не работать"
      - alert: BotMetricsUnavailable
        expr: |
          sum by (instance) (rate(botkit_updates_total{job="botkit"}[1h])) > 1e-3
          and on(instance) absent_over_time(botkit_errors_total{job="botkit"}[1h])
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Нет метрик ошибок: {{ $labels.instance }}"
          description: "botkit_errors_total отсутствует при активном трафике — error/burn-алерты не работают"

      # absent() is load-bearing here. A staleness expression on its own matches nothing
      # while the series is missing, so a checker that never ran, or one whose metrics
      # directory became unwritable, would leave the fleet green forever - the exact
      # failure of 26.09.2026, one level further up.
      - alert: BotWebhookCheckStale
        expr: |
          absent(botkit_webhook_check_timestamp)
          or (time() - botkit_webhook_check_timestamp > 1800)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Проверка доставки webhook не обновляет метрики"
          description: "botkit_webhook_check_timestamp не меняется больше 30 минут или отсутствует совсем. Пока метрики заморожены, их прежние значения читаются как «доставка работает» — тот же класс отказа, что был 26.09.2026. Проверить: systemctl status botkit-webhook-check.timer; journalctl -u botkit-webhook-check; строки 'ERROR metrics not published' в /var/log/botkit-webhook-check.log; ls -l /var/lib/node-exporter-textfile"
  - name: node
    rules:
      - alert: HostDiskSpaceHigh
        expr: |
          (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs"}) > 0.85
          and node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs"} > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Disk >85% на {{ $labels.device }}"
          description: "Занято {{ $value | humanizePercentage }} на {{ $labels.mountpoint }}"

      - alert: HostMemHigh
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.92
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "RAM >92%"
          description: "Занято {{ $value | humanizePercentage }}. Swap: {{ $labels.instance }}"

      - alert: HostLoadHigh
        expr: node_load1 > 6
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Load1 {{ $value }} на хосте"
          description: "Load average 1m превысил 6 в течение 15m"

      - alert: HostUnreachable
        expr: up{job="node"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "node_exporter недоступен"
          description: "Метрики хоста пропали — {{ $labels.instance }}"

      - alert: BotWebhookTLSUntrusted
        expr: probe_success{job="webhook-trusted"} == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Telegram не сможет проверить TLS webhook: {{ $labels.bot }}"
          description: "Публичный серт не проходит проверку доверия (job webhook-trusted, модуль tls_trusted). Симптом: getWebhookInfo вернёт 'certificate verify failed' и апдейты перестанут доставляться. Проверить цепочку серта и has_custom_certificate."

      - alert: BotkitBackupStale
        expr: botkit_backup_age_seconds > 28800
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "Offsite-бэкап потока {{ $labels.stream }} старше 8 часов"
          description: "Последний снапшот restic старше 8 часов (факт: {{ $value | humanizeDuration }}). Снапшот идёт каждые 6 часов — минимум один запуск пропущен либо репозиторий на мониторе недоступен."

      - alert: BotkitBackupFailed
        expr: botkit_backup_ok == 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Проверка offsite-бэкапа потока {{ $labels.stream }} не проходит"
          description: "botkit-restic-check не смог получить список снапшотов (репозиторий недоступен) либо снапшот старше порога 15+ минут."

      - alert: BotkitBackupCheckMissing
        expr: absent(botkit_backup_ok)
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "Метрики проверки бэкапа нет"
          description: "botkit_backup_ok не поступает от node_exporter более 30 минут — таймер botkit-restic-check.timer не работает, свежесть бэкапов не контролируется."
