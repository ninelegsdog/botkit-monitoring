global:
  scrape_interval: 15s
  evaluation_interval: 30s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

scrape_configs:
  - job_name: botkit
    metrics_path: /metrics
    static_configs:
      - targets:
          - 127.0.0.1:8081  # bookingbot
          - 127.0.0.1:8082  # leadgen
          - 127.0.0.1:8083  # store
          - 127.0.0.1:8084  # support
          - 127.0.0.1:8085  # membership
          - 127.0.0.1:8086  # pricesentry
          - 127.0.0.1:8087  # docuflow
          - 127.0.0.1:8088  # delivery
          - 127.0.0.1:8089  # reminder
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: 127\.0\.0\.1:(\d+)
        replacement: bot-${1}

  - job_name: blackbox-cert
    metrics_path: /probe
    params:
      module: [ssl_check]
    static_configs:
      - targets:
          - https://127.0.0.1:443/healthz  # nginx TLS, self-signed cert ninelegsbots.duckdns.org
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__address__]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

  - job_name: blackbox-webhooks
    metrics_path: /probe
    params:
      module: [duckdns_http]
    static_configs:
      - targets:
          - https://ninelegsbots.duckdns.org/webhook/bookingbot
          - https://ninelegsbots.duckdns.org/webhook/leadgen
          - https://ninelegsbots.duckdns.org/webhook/store
          - https://ninelegsbots.duckdns.org/webhook/support
          - https://ninelegsbots.duckdns.org/webhook/membership
          - https://ninelegsbots.duckdns.org/webhook/pricesentry
          - https://ninelegsbots.duckdns.org/webhook/docuflow
          - https://ninelegsbots.duckdns.org/webhook/delivery
          - https://ninelegsbots.duckdns.org/webhook/reminder
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__address__]
        regex: .*webhook/(\w+)
        target_label: bot
        replacement: ${1}
      - target_label: __address__
        replacement: 127.0.0.1:9115

  - job_name: otlp-blackbox
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - 127.0.0.1:4317
          - 127.0.0.1:4318
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__address__]
        regex: (.*)
        target_label: otlp_port
        replacement: ${1}
      - source_labels: [__address__]
        regex: (.*):(\d+)
        target_label: instance
        replacement: ${1}-${2}
      - target_label: __address__
        replacement: 127.0.0.1:9115

  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]
rule_files:
  - /etc/prometheus/alerts.yml
