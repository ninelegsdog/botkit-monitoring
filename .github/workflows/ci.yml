name: CI
on: [push, pull_request]
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5.0.0
      - name: compose config
        run: |
          MINIO_ROOT_USER=ci MINIO_ROOT_PASSWORD=ci docker compose config --quiet
      - name: promtool check
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/prometheus:/etc/prometheus" prom/prometheus:v3.8.1 \
            check config /etc/prometheus/prometheus.yml
      - name: promtool check rules
        # A rules file that does not parse is an alert that never fires - the same silence
        # that let a 15-day outage look healthy. `check config` alone does not cover it.
        # blackbox.yml is a scrape config, not rule groups, so it stays under `check
        # config`; feeding it to `check rules` fails on a type mismatch, not on a defect.
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/prometheus:/etc/prometheus" prom/prometheus:v3.8.1 \
            check rules /etc/prometheus/alerts.yml
      - name: promtool check metrics
        # Generated from the same renderers the production path uses, so this cannot rot
        # into passing against a fixture that no longer matches the code. Without it, a
        # malformed gauge (unescaped label, HELP/TYPE mismatch) is only discovered when
        # the fleet is already relying on it.
        run: |
          python ops/e2e/webhook_metrics.py \
            | docker run --rm -i --entrypoint promtool prom/prometheus:v3.8.1 check metrics
      - name: dashboard json
        # A provisioned dashboard is read by Grafana, not by anything in this repository, so a
        # syntax error there breaks the panels silently while every other gate stays green.
        # This is the JSON twin of the `check rules` step: the file that must parse is the
        # one the product actually reads.
        run: |
          find grafana -name '*.json' -print0 | xargs -0 -n1 python -m json.tool --sort-keys
      - name: yamllint
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c  # v3
        with:
          config_file: .yamllint.yml

  # The ops checks are the only things that can tell that updates are actually
  # deliverable, and until 26.09 nothing ran them here: a monitoring repository whose CI
  # validated only YAML is a repository that cannot notice its own checks rotting.
  ops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5.0.0
      - name: install tools
        # The runner's own Python instead of actions/setup-python: pinning that action
        # needs a commit SHA, and a guessed one is worse than no pin at all.
        run: |
          python --version
          python -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 10) else 1)'
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet "ruff==0.16.0" -r ops/e2e/requirements.txt
      - name: ruff
        # Pinned so a new lint rule cannot turn the main branch red on an unrelated push.
        run: ruff check --output-format=concise .
      - name: pytest
        working-directory: ops/e2e
        run: |
          PYTHONPATH=. python -m pytest -q
      - name: shellcheck
        # ops/drift/validate_compose.py is what shellcheck flagged here, and it flagged a
        # real "used before it took effect" bug inside a drift check - a check whose
        # silence is what let a 15-day outage look healthy.
        run: |
          shellcheck --version
          find ops -name '*.sh' -print0 | xargs -0 shellcheck --severity=warning
      - name: shell syntax
        run: |
          find ops -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: backup freshness parser
        # The parser picks which restic snapshot decides the backup's age. Picking the
        # wrong one flipped a healthy offsite backup to "stale" and fired false alerts
        # on 2026-09-28; the test feeds a multi-entry JSON and fails on the old d[0] logic.
        run: |
          bash ops/backup/restic-check-test.sh
      # systemd-analyze verify was tried here and dropped: on any real machine it also
      # resolves the host's own units and reports every ExecStart path as missing, so it
      # is always red and trains people to ignore it. The directives that actually broke
      # in production - ExecStart pointing at a stale copy, the deploy hook that could not
      # execute - are asserted in ops/e2e/tests/test_smoke_schedule.py and
      # test_certbot_deploy.py, which fail loudly and mean it.

  secrets:
    runs-on: ubuntu-latest
    env:
      # Pinned like the prometheus image above: a scanner that changes its rule set
      # under a floating reference would turn this gate green for the wrong reason.
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5.0.0
        with:
          # A secret that was committed once stays in history, so the scan needs every
          # commit rather than the single one being built.
          fetch-depth: 0
      - name: gitleaks
        # Everything else here validates that the repository is well-formed; nothing
        # here would notice a bot token pushed alongside a compose file, and this
        # remote is public.
        run: |
          # Run the pinned binary on the runner rather than in a container. Two failures
          # argued for this: bind-mounting the checkout made git reject the repository as
          # dubious ownership, after which gitleaks scanned zero commits and printed "no
          # leaks found" with exit 0 - a green gate that inspected nothing. Then the image
          # pull failed on the runner while the identical scan passed locally. The runner
          # owns its own workspace, so this form has no ownership question to get wrong.
          curl -sSfL -o /tmp/gitleaks_checksums.txt \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          expected=$(awk -v f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" '{n=$2; sub(/^\*/,"",n); if (n==f) print $1}' /tmp/gitleaks_checksums.txt)
          echo "$expected  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version
          # --verbose so a future red run says which rule and which commit, not just "leaks
          # found" - the same reason this job refuses to report success without evidence.
          /tmp/gitleaks git --no-banner --redact --verbose \
            --baseline-path .gitleaks-baseline.json
