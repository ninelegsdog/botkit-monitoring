name: secret-audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:

      - name: fingerprint secrets.SSH_KEY
        env:
          SK: ${{ secrets.SSH_KEY }}
        run: |
          umask 077
          printf '%s
' "$SK" > /tmp/sk
          if ssh-keygen -y -f /tmp/sk > /tmp/sk.pub 2>/dev/null; then
            echo -n "secrets.SSH_KEY fingerprint: "
            ssh-keygen -lf /tmp/sk.pub
          else
            echo "secrets.SSH_KEY: не является открытым SSH-ключом (OpenSSH format)"
          fi
          rm -f /tmp/sk /tmp/sk.pub
