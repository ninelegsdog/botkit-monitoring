name: AI PR review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  models: read

jobs:
  ai-review:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build diff
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1 || true
          git diff "origin/${{ github.base_ref }}"...HEAD -- . ':(exclude)*.lock' ':(exclude)uv.lock' | head -c 12000 > /tmp/pr.diff
          echo "diff bytes: $(wc -c < /tmp/pr.diff)"

      - name: Request AI review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/ai_review.py

      - name: Post comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --body "## AI review (non-blocking)

          $(cat /tmp/review.txt)

          ---
          *Generated by GitHub Models (gpt-4o-mini). Non-blocking.*" || true
