name: Feature request
description: Suggest a change, and say how "done" would be verified
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        The most useful part of a feature request is not the idea — it is how you
        would tell that it works. A change that cannot be observed failing is not
        finished.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation, not the implementation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: How would we know it works?
      description: |
        What would you run, and what would you see that proves it? If the answer
        is only "the new feature exists", the feature is not observable yet.
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Where does it belong?
      options:
        - Bot handlers
        - Webhook endpoint
        - Admin panel
        - Storage or migrations
        - Deployment or CI
        - Documentation only
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
