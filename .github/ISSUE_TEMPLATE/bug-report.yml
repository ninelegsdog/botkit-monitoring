name: Bug report
description: Something behaves differently from what it says it does
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This project runs in production. A useful report names what you ran, what
        you expected and what happened — not just the symptom.

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Tag, or the commit SHA you ran.
      placeholder: v1.0.0 or 56b5541
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Where does it happen?
      options:
        - Bot handlers
        - Webhook endpoint
        - Admin panel
        - Storage or migrations
        - Deployment or CI
        - Something else
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Include the exact log lines or the response body.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: |
        1.
        2.
        3.
      render: text
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs, trace or report
      description: |
        Scrub tokens, session strings and customer identifiers before pasting.
        See SECURITY.md if you think you have found something exploitable.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues for this.
          required: true
        - label: I removed secrets and customer data from everything above.
          required: true
