name: e2e
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: botkit-monitoring/ops/e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest -q
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_PHONE: ${{ secrets.TG_PHONE }}
          E2E_TIMEOUT: "20"
