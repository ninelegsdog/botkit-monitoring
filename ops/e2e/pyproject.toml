[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "botkit-e2e"
version = "0.1.0"
description = "End-to-end monitoring for botkit Telegram bots"
requires-python = ">=3.10"
dependencies = [
    "telethon",
    "pyyaml",
    "requests",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["e2e*"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".ruff_cache", ".pytest_cache", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "PL"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
