# E2E smoke scenarios for the 9-bot fleet (live runner: ops/e2e/run_e2e.py).
#
# Each step sends `send` and waits (no sleep) for the next bot message whose
# text contains `expect`. Every `expect` below is a substring proven live.
#
# SAFETY RULES (enforced by tests/test_no_payment_scenarios.py):
#   * READ-ONLY only: no step may create, pay for, subscribe to or delete
#     anything. Empty-state replies are deterministic for the E2E test account,
#     which has no orders/tickets/items/documents/reminders.
#   * No payment markers in `send` or `expect` (оплат, pay, счёт, юkassa, ...).
#   * No admin-only commands: the E2E account is an admin in every bot, so a
#     stray admin command would mutate real production data.
#
# EMPTY STATE IS AN ASSUMPTION, NOT A CONTRACT. The account is isolated but it
# is also an admin everywhere, so a human can leave an order or a ticket behind.
# Views whose text depends on that state use `expect_any`: both the empty-state
# reply and the list reply are correct bot behaviour, and asserting only the
# empty one turned valid work into UnexpectedReply twice (29-30.10, 08.11) and
# sent the reader to debug a healthy bot. Steps that remain on `expect` are
# state-independent (menus, /start, not-found replies).
#
# `press` taps an inline button already on screen (by callback_data) and waits for
# the bot's EDITED reply. Only allowlisted read-only buttons may be pressed - see
# tests/test_no_unapproved_actions.py. bookingbot and membership are inline-only,
# so their read-only views (book:my / mem:my) are reached this way.

"botkit-bookingbot":
  steps:
    - send: "/start"
      expect: "Выберите действие:"
    - send: "/start"
      expect: "Выберите действие:"
    - press: "book:my"
      expect: "Нет активных записей"

"botkit-delivery":
  steps:
    - send: "/start"
      expect: "Отслеживание заказов и доставок"
    - send: "🔍 Проверить заказ"
      expect: "Введите номер заказа"
    # Unknown order number: the lookup fails read-only and says so.
    - send: "E2E-НЕТ-ЗАКАЗА"
      expect: "Заказ не найден"

"botkit-docuflow":
  steps:
    - send: "/start"
      expect: "Генерация документов в Telegram"
    - send: "🗂 Мои документы"
      expect: "Нет документов"

"botkit-leadgen":
  steps:
    - send: "/start"
      expect: "Здравствуйте! Оставьте заявку"
    - send: "📞 Контакты"
      expect: "Телефон:"

"botkit-membership":
  steps:
    - send: "/start"
      expect: "Добро пожаловать! Выберите действие"
    - send: "/start"
      expect: "Добро пожаловать! Выберите действие"
    # mem:my edits the message to the empty state or to "👤 Подписка: <plan>". The E2E
    # account is an admin everywhere and can hold a subscription, so both replies are
    # correct bot behaviour; asserting only the empty one made every run since 12.11 red
    # with BotNotAnswering - a press step fails on the *edited* text, and the bot did edit.
    - press: "mem:my"
      expect_any:
        - "У вас нет активной подписки"
        - "👤 Подписка:"

"botkit-pricesentry":
  steps:
    - send: "/start"
      expect: "Мониторинг цен на маркетплейсах"
    - send: "📦 Мои товары"
      expect: "Нет мониторинга"
    - send: "🔔 Мои уведомления"
      expect: "Нет уведомлений"
    - send: "📊 Статистика"
      expect: "Ваши товары: 0"

"botkit-reminder":
  steps:
    - send: "/start"
      expect: "Подпишитесь на напоминания и рассылки"
    # The list reply is "#<id> <type> <when> — <text>" per reminder. The separator is the
    # only part of it that does not depend on the account's state, and the E2E account can
    # have reminders left behind - UnexpectedReply on every run since 12.11.
    - send: "⏰ Мои напоминания"
      expect_any:
        - "Нет напоминаний"
        - " — "

"botkit-store":
  steps:
    - send: "/start"
      expect: "Добро пожаловать в магазин"
    - send: "🛒 Корзина"
      expect: "Корзина пуста"
    - send: "📦 Мои покупки"
      expect_any:
        - "Нет покупок"
        - "📦 Заказ #"

"botkit-support":
  steps:
    - send: "/start"
      expect: "Здравствуйте! Чем можем помочь"
    - send: "❓ Помощь"
      expect: "Чтобы мы помогли"
    - send: "📋 Мои тикеты"
      expect_any:
        - "нет тикетов"
        - "🎫 Тикет #"
