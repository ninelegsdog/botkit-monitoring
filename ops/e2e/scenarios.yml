# E2E-сценарии (пересобраны 2026-09-25 из исходников, НЕ из фиктивных ожиданий).
# Матчинг — substring: expect должен встречаться в reply.
# Шаг 1: /start → приветствие (точный текст из кода).
# Шаг 2: повторный /start → то же приветствие (идемпотентность /start).
# Глубокие диалоги по кнопкам — когда появится Telegram-аккаунт (E1 финальный DoD).
#
# ПРАВИЛО: никаких платёжных сценариев. Ожидаемая строка не может быть кнопкой
# оплаты, и `send` не может быть командой платёжного провайдера. Причина
# конкретная: tests/test_deposit_e2e.py в botkit-bookingbot — это контейнерный
# тест БД, а не Telegram-сценарий, поэтому документ, называвший его источником
# риска, указывал не туда. Реальный риск — будущие сценарии, и он закрыт
# машинно в tests/test_no_payment_scenarios.py, а не «прочитайте diff».
botkit-bookingbot:
  steps:
    - send: /start
      expect: "Выберите действие:"
    - send: /start
      expect: "Выберите действие:"
