# Telegram usernames of the nine production bots, resolved once on the machine
# that can read the bot tokens and committed here.
#
# The E2E runner reads usernames only and therefore cannot impersonate any of the
# nine bots. That is the point of this file: a test host that logs in as a user
# must not also be able to act as the bots it tests. The gate is
# tests/test_no_token_reads.py, which denies the removed token helpers by name,
# denies `requests`, denies credential literals, and fails if this file or
# scenarios.yml does not cover exactly the nine bots.
#
# Resolved with tools/resolve_bots.py (one-shot, deleted after use - it is the
# only code that ever reads a bot token to produce this file). Values are quoted:
# a bare @ is a YAML reserved indicator and would make the file a parse error.
botkit-bookingbot: "SaasBookingKitBot"
botkit-delivery: "DeliveryKitBot"
botkit-docuflow: "DocuflowKitBot"
botkit-leadgen: "LeadgenKitBot"
botkit-membership: "MembershipKitBot"
botkit-pricesentry: "PricesentryKitBot"
botkit-reminder: "ReminderKitBot"
botkit-store: "StoreKitBot"
botkit-support: "SaasSupportKitBot"
