# nginx reverse proxy for Telegram webhooks.
# Terminates TLS and forwards /webhook/<bot> to the bot container's local port.
# The bot itself validates X-Telegram-Bot-Api-Secret-Token, so nginx does not
# need the secret. Bots must be switched polling -> webhook (P9) and expose
# /webhook on their metrics port (127.0.0.1:808x).

# bot name -> local metrics/webhook port (see prometheus.yml targets)
map $bot $bot_port {
    bookingbot  8081;
    leadgen     8082;
    store       8083;
    support     8084;
    membership  8085;
    pricesentry 8086;
    docuflow    8087;
    delivery    8088;
    reminder    8089;
    default     0;
}

server {
    listen 80;
    server_name ninelegsbots.duckdns.org;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location /healthz { return 200 "ok\n"; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name ninelegsbots.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/ninelegsbots.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ninelegsbots.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    location /healthz { return 200 "ok\n"; }

    location ~ ^/webhook/(?<bot>.+)$ {
        proxy_pass http://127.0.0.1:$bot_port;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Telegram-Bot-Api-Secret-Token $http_x_telegram_bot_api_secret_token;
        proxy_read_timeout 65s;
    }
}
