server:
  http_listen_port: 9080
  grpc_listen_port: 9097

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://127.0.0.1:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 102400

scrape_configs:
  - job_name: botkit-containers
    pipeline_stages:
      - json:
          expressions:
            level: levelname
            message: message
            bot: bot
            conversation_id: conversation_id
            name: name
            asctime: asctime
      - labels:
          level:
          bot:
          conversation_id:
    static_configs:
      - targets:
          - localhost
        labels:
          job: botkit-logs
          __path__: /var/lib/docker/containers/*/*-json.log
