name: botkit-monitoring

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  prometheus:
    image: prom/prometheus:v3.8.1
    network_mode: host
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.listen-address=127.0.0.1:9090
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prom-data:/prometheus
    logging: *default-logging

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    network_mode: host
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox/blackbox.yml
      - --web.listen-address=127.0.0.1:9115
    volumes:
      - ./prometheus/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    logging: *default-logging

  alertmanager:
    image: prom/alertmanager:v0.28.1
    network_mode: host
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        bot_token="$${TG_BOT_TOKEN:-0:FILL_ME}"; chat_id="$${TG_CHAT_ID:-1}"; sed -e "s/\$${TG_BOT_TOKEN}/$$bot_token/g" -e "s/\$${TG_CHAT_ID}/$$chat_id/g" /etc/alertmanager/alertmanager.yml.tpl > /tmp/am.yml
        exec /bin/alertmanager --config.file=/tmp/am.yml --storage.path=/alertmanager --cluster.listen-address=127.0.0.1:9094 --web.listen-address=127.0.0.1:9093
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - am-data:/alertmanager
    environment:
      TG_BOT_TOKEN: ${TG_BOT_TOKEN}
      TG_CHAT_ID: ${TG_CHAT_ID}
    logging: *default-logging

  grafana:
    image: grafana/grafana:12.3.1
    network_mode: host
    restart: unless-stopped
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: 3000
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - gf-data:/var/lib/grafana
    logging: *default-logging

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.119.0
    network_mode: host
    restart: unless-stopped
    command:
      - --config=/etc/otelcol-contrib/config.yaml
    volumes:
      - ./otelcol:/etc/otelcol-contrib:ro
    logging: *default-logging

  tempo:
    image: grafana/tempo:2.6.0
    network_mode: host
    restart: unless-stopped
    command:
      - --config.file=/etc/tempo/config.yaml
    volumes:
      - ./tempo:/etc/tempo:ro
      - tempo-data:/var/tempo
    logging: *default-logging

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    network_mode: host
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio-data:/data
    logging: *default-logging

  loki:
    image: grafana/loki:3.1.0
    user: "0:0"
    network_mode: host
    restart: unless-stopped
    command:
      - --config.file=/etc/loki/config.yaml
    volumes:
      - ./loki:/etc/loki:ro
      - ./loki-data/chunks:/var/loki/chunks
      - ./loki-data/rules:/var/loki/rules
    logging: *default-logging

  promtail:
    image: grafana/promtail:3.1.0
    network_mode: host
    restart: unless-stopped
    command:
      - --config.file=/etc/promtail/config.yaml
    volumes:
      - ./promtail:/etc/promtail:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging: *default-logging

volumes:
  prom-data:
  am-data:
  gf-data:
  tempo-data:
  minio-data:
  loki-data:
