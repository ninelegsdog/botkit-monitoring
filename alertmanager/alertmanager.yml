global:
  resolve_timeout: 5m

route:
  receiver: telegram
  group_by: [alertname, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: telegram
    telegram_configs:
      - bot_token: "${TG_BOT_TOKEN}"
        chat_id: -100${TG_CHAT_ID}
        send_resolved: true
        parse_mode: ""
